<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<main layout:fragment="content" class="container my-2">
	<script src="/js/quo/quo.js"></script>
	<link rel="stylesheet" href="/css/quo/quo.css">
	
	<div class="container section-container p-4 border rounded shadow-sm">
    	<div class="text-center">
        	<h3>수주 관리</h3>
        	<form th:action="@{/quo}" method="get">
				<div class="row align-items-center mb-3">
					<div class="col-sm-3">
						<select class="form-select" name="category" id="category">
							<option value="">category</option>
							<option value="수주번호">수주번호</option>
							<option value="발주업체">발주업체</option>
							<option value="발주일자">발주일자</option>
							<option value="납기일자">납기일자</option>
							<option value="승인상태">승인상태</option>
						</select>
					</div>
					<div class="col-sm-9">
						<div class="d-flex align-items-center">
							<th:block >
							<input type="text" class="form-control" name="search" placeholder="검색어를 입력하세요" required/>
							<button class="btn btn-success ms-2" type="submit" style="width: 100px;">검색</button>
						</div>
					</div>
				</div>
			</form>
       </div>
       
       <div>
       <form th:action="@{/}" method="post"></form>
    	<table class="table table-bordered mt-4">
        	<thead>
           		<tr>
                	<th>번호</th>
                	<th>수주번호</th>
                	<th>발주업체</th>
                	<th>발주일자</th>
                	<th>납기일자</th>
                	<th>승인상태</th>
            	</tr>
        	</thead>
        	<tbody>
           		<tr th:each="i, iterStat : ${result}" 
           			th:attr="data-quoNo=${i.quoNo}, data-bizName=${i.bizName}, data-quoDate=${i.quoDate}, data-deliDate=${i.deliDate}, data-quoStatus=${i.quoStatus}"
            		style="cursor: pointer;">
               		
               		<td th:text="${iterStat.index + 1}"></td>
               		<td th:text="${i.quoNo}"></td>
               		<td th:text="${i.bizName}"></td>
               		<td th:text="${i.quoDate}"></td>
               		<td th:text="${i.deliDate}"></td>
               		<td th:text="${i.quoStatus}"></td>
           		</tr>
       		</tbody>
   		</table>             
       </div>
	</div>
	<div class="modal fade"	 id="supplierModal" tabindex="-1" aria-labelledby="supplierModalLabel" aria-hidden="true">
	    <div class="modal-dialog">
	        <div class="modal-content">
	            <div class="modal-header">
	                <h5 class="modal-title" id="supplierModalLabel">수주 상세정보</h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	            </div>
	            <div class="modal-body ">
	            <div class = "container-flex">
	            	<table id="quoCustomer" class = "table-half">
	            	</table>
	            	<table id="quoSeller" class = "table-half">
	            	</table>
	            </div>
	            	<table id="quoDetailTable">
					    <thead></thead>
					    <tbody></tbody>
					    <tfoot></tfoot>
					</table>
	            </div>
	            <div class="modal-footer">
	            	<a class="btn btn-secondary" href = "/transpSendEmail">운송업체 요청</a>
	                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
	                
	            </div>
	        </div>
	    </div>
	</div>

</main>
</html>
