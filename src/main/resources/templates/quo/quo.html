<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/side.css">
    <meta charset="UTF-8">
    <title>수주관리</title>
    
</head>
<main layout:fragment="content" class="container my-2">
<!--     <script>
        function loadData() {
            document.getElementById("data-container").innerHTML = "<div class='col-sm-12'>데이터 없음</div>";
        }
        window.onload = loadData;
    </script> -->
    <!--(MODAL)발주서 상세조회창-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
	<div class="container section-container p-4 border rounded shadow-sm">
    	<div class="text-center">
        	<h3>수주 관리</h3>
        	<form th:action="@{/quo}" method="get">
			<div class="row align-items-center mb-3">
    		<div class="col-sm-3">
        		<select class="form-select" name="category">
            		<option selected>번호</option>
            		<option value="수주번호">수주번호</option>
            		<option value="발주업체">발주업체</option>
            		<option value="발주일자">발주일자</option>
            		<option value="납기일자">납기일자</option>
            		<option value="승인상태">승인상태</option>
        		</select>
    		</div>
    		<div class="col-sm-9">
        		<div class="d-flex align-items-center">
            		<th:block >
            		<input type="text" class="form-control" name="search"/>
            		<!-- th:attr="placeholder=${param.category == \'수주번호\' ? '숫자를 입력하세요' : 
                            		param.category == \'발주업체\' ? '업체명을 입력하세요' : 
                            		param.category == \'발주일자\' ? 'ex)yyyymmdd' : 
                            		param.category == \'납기일자\' ? 'ex)yyyymmdd' : 
                            		param.category == \'승인상태\' ? '상태값을 입력하세요' : '검색어를 입력하세요'}" -->
            		<button class="btn btn-success ms-2" type="submit" style="width: 100px;">검색</button>
        		</div>
    		</div>
			</div>
			</form>
       </div>
       
    	<table class="table table-bordered mt-4">
        	<thead>
           		<tr>
                	<th>번호</th>
                	<th>수주번호</th>
                	<th>발주업체</th>
                	<th>발주일자</th>
                	<th>납기일자</th>
                	<th>승인상태</th>
            	</tr>
        	</thead>
        	<tbody>
            <!-- inboundList는 controller에서 전달받은 데이터 -->
           		<tr th:each="i, iterStat : ${result}" data-bs-toggle="modal" data-bs-target="#supplierModal">
               		
               		<td th:text="${iterStat.index + 1}"></td>
               		<td th:text="${i.quoNo}"></td>
               		<td th:text="${i.bizName}"></td>
               		<td th:text="${i.quoDate}"></td>
               		<td th:text="${i.deliDate}"></td>
               		<td th:text="${i.quoStatus}"></td>
           		</tr>
       		</tbody>
   		</table>             
	</div>
</body>
</main>
</html>
