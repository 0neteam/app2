<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

<main layout:fragment="content" class="container my-2">
    <link rel="stylesheet" href="/css/prod/prod.css">        
    <script src="/js/prod/prod.js"></script>

    <div class="container">
        <!-- 메인 콘텐츠 -->
        <div class="main-content">
            <h2>재고현황</h2>

            <!-- 검색과 버튼들 -->
            <div class="search-bar">
                <select id="search-type" name="search-type">
                    <option value="code">품목코드</option>
                    <option value="name">품목명</option>
                </select>
                <input type="text" id="search-input" name="search-input" placeholder="검색...">
                <button id="search-btn" name="search-btn" class="btn btn-primary">검색</button>
                <button id="add-btn" name="add-btn" class="btn btn-success">추가</button>
            </div>

            <!-- 재고 목록 테이블 -->
            <table class="table">
			    <thead>
			        <tr>
			            <th>품목 코드</th>
			            <th>품목명</th>
			            <th>재고 수량</th>
			            <th>판매가</th>
			            <th>날짜</th>
			            <th>상태</th>
			        </tr>
			    </thead>
			    <tbody>
			        <tr th:each="prod : ${prodList}">
			            <td th:text="${prod.itemCode}" class="prod-itemCode" th:data-item-code="${prod.itemCode}"></td>
			            <td>
			                <!-- 품목명 수정 input -->
			                <span th:text="${prod.name}" class="prod-name"></span>
			                <input type="text" th:value="${prod.name}" class="prod-name-input" style="display:none;">
			            </td>
			            <td>
			                <!-- 재고 수량 수정 input -->
			                <span th:text="${prod.qty}" class="prod-qty"></span>
			                <input type="number" th:value="${prod.qty}" class="prod-qty-input" style="display:none;">
			            </td>
			            <td>
			                <!-- 판매가 수정 input -->
			                <span th:text="${prod.price}" class="prod-price"></span>
			                <input type="text" th:value="${prod.price}" class="prod-price-input" style="display:none;" >
			            </td>
			            <td th:text="${prod.regDate}"></td>
			            <td>
			                <!-- 수정 버튼 -->
			                <button class="btn btn-primary btn-sm edit-btn" th:data-item-code="${prod.itemCode}">
			                    <i class="fas fa-edit"></i> 수정
			                </button>
			                <!-- 저장 버튼 (수정 완료 후 저장) -->
			                <button class="btn btn-success btn-sm save-btn" style="display:none;" th:data-item-code="${prod.itemCode}">
			                    <i class="fas fa-save"></i> 저장
			                </button>
			                <!-- 삭제 버튼 -->
			                <button class="btn btn-danger btn-sm delete-btn" th:data-item-code="${prod.itemCode}">
			                    <i class="fas fa-trash-alt"></i> 삭제
			                </button>
			                <button class="btn btn-secondary btn-sm cancel-btn" style="display:none;" th:data-item-code="${prod.itemCode}">
			                	<i class="fas fa-trash-alt"></i> 취소
			                </button>
			            </td>
			        </tr>
			    </tbody>
			</table>

            <!-- 모달 -->
            <div id="modal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>새 품목 추가</h2>
                    <form th:action="@{/prod/add}" method="POST">
                        <label for="item-name">품목명:</label>
                        <input type="text" id="item-name" name="name">
                        
                        <label for="item-qty">재고 수량:</label>
                        <input type="number" id="item-qty" name="qty">
                        
                        <label for="item-price">판매가:</label>
                        <input type="number" id="item-price" name="price">    
                        
                        <button type="submit" class="btn btn-primary">저장</button>
                    </form>
                    <button class="btn btn-secondary" onclick="location.href='/prod'">취소</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 모달 열기
        const modal = document.getElementById("modal");
        const addBtn = document.getElementById("add-btn");
        const closeBtn = document.querySelector(".close");

        // "추가" 버튼 클릭 시 모달 열기
        addBtn.onclick = function() {
            modal.style.display = "block";
        }

        // "X" 버튼 클릭 시 모달 닫기
        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        // 모달 외부 클릭 시 모달 닫기
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</main>

</body>
</html>
