<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<main layout:fragment="content" class="container my-2">
    <div class="container section-container p-4 border rounded shadow-sm">
        <div class="text-center">
            <h3>운송 현황</h3>
            <form th:action="@{/transp/search}" method="get">
                <div class="row align-items-center mb-3">
                    <div class="col-sm-3">
                        <select class="form-select" name="category" id="category">
 							<option value="운송상태" th:selected="${param.category == '운송상태'}">운송 상태</option>
                            <option value="운송번호" th:selected="${param.category == '운송번호'}">운송 번호</option>
                            <option value="발주번호" th:selected="${param.category == '발주번호'}">발주 번호</option>
                            <option value="출발지" th:selected="${param.category == '출발지'}">출발지</option>
                            <option value="목적지" th:selected="${param.category == '목적지'}">목적지</option>
                            <option value="운송기사정보" th:selected="${param.category == '운송기사정보'}">운송기사 정보</option>
                        </select>
                    </div>
                    
                    <div class="col-sm-9">
						<div class="d-flex align-items-center">
							<th:block >
							<input type="text" class="form-control" name="search" placeholder="상태값을 입력하세요"/>
							<button class="btn btn-success ms-2" type="submit" style="width: 100px;">검색</button>
						</div>
                    </div>
                </div>
            </form>
        </div>
        
        <div>
            <table class="table table-bordered mt-4">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>운송 번호</th>
                        <th>발주 번호</th>
                        <th>출발지</th>
                        <th>목적지</th>
                        <th>운송기사 정보</th>
                        <th>운송 상태</th>
                    </tr>
                </thead>
                
<tbody>
    <tr th:each="i, iterStat : ${transpList}" 
        th:attr="data-transp-no=${i.transpNo}, 
                 data-order-no=${i.orderNo}, 
                 data-departure=${i.departure}, 
                 data-dstn=${i.dstn}, 
                 data-driver-name=${i.driverName}, 
                 data-driver-phone=${i.driverPhone}, 
                 data-transp-status=${i.transpStatus != null ? i.transpStatus : '미정'},
                 data-transp-date=${i.transpDate}"
        onclick="showModal(this)" style="cursor: pointer;">
        <td th:text="${iterStat.index + 1}"></td>
        <td th:text="${i.transpNo}"></td>
        <td th:text="${i.orderNo}"></td>
        <td th:text="${i.departure}"></td>
        <td th:text="${i.dstn}"></td>
        <td th:text="${i.driverName}"></td>
        <td th:text="${i.transpStatus != null ? i.transpStatus : '미정'}"></td>
    </tr>
</tbody>



            </table>
        </div>
    </div>

	<div class="modal fade" id="transpModal" tabindex="-1" aria-labelledby="transpModalLabel" aria-hidden="true">
	    <div class="modal-dialog">
	        <div class="modal-content">
	            <div class="modal-header">
	                <h5 class="modal-title" id="transpModalLabel">운송 상세정보</h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	            </div>
	            <div class="modal-body">
	                <table class="table">
	                    <tbody>
	                        <tr>
	                            <th>운송 번호</th>
	                            <td id="modalTranspNo"></td>
	                        </tr>
	                        <tr>
	                            <th>발주 번호</th>
	                            <td id="modalOrderNo"></td>
	                        </tr>
	                        <tr>
	                            <th>출발지</th>
	                            <td id="modalDeparture"></td>
	                        </tr>
	                        <tr>
	                            <th>목적지</th>
	                            <td id="modalDstn"></td>
	                        </tr>
	                        <tr>
	                            <th>운송기사 이름</th>
	                            <td id="modalDriverName"></td>
	                        </tr>
	                        <tr>
	                            <th>운송기사 전화번호</th>
	                            <td id="modalDriverPhone"></td>
	                        </tr>
	                        <tr>
	                            <th>운송 상태</th>
	                            <td id="modalTranspStatus"></td>
	                        </tr>
	                        <tr>
	                            <th>운송 날짜</th>
	                            <td id="modalTranspDate"></td>
	                        </tr>
	                    </tbody>
	                </table>
	            </div>
	            <div class="modal-footer">
	                <button type="button" class="btn btn-danger">운송 취소</button>
	                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
	            </div>
	        </div>
	    </div>
	</div>
<script>
    function showModal(row) {
        // Modal에 데이터를 채우는 코드
        document.getElementById("modalTranspNo").innerText = row.getAttribute("data-transp-no");
        document.getElementById("modalOrderNo").innerText = row.getAttribute("data-order-no");
        document.getElementById("modalDeparture").innerText = row.getAttribute("data-departure");
        document.getElementById("modalDstn").innerText = row.getAttribute("data-dstn");
        document.getElementById("modalDriverName").innerText = row.getAttribute("data-driver-name");
        document.getElementById("modalDriverPhone").innerText = row.getAttribute("data-driver-phone");
        document.getElementById("modalTranspStatus").innerText = row.getAttribute("data-transp-status");
        document.getElementById("modalTranspDate").innerText = row.getAttribute("data-transp-date");

        var modal = new bootstrap.Modal(document.getElementById('transpModal'));
        modal.show();

        // 운송 취소 버튼 클릭 시 호출되는 함수
        document.getElementById("cancelTranspButton").onclick = function() {
            cancelTransp(row.getAttribute("data-transp-no"));
        }
    }

    // 운송 취소 처리 함수
    function cancelTransp(transpNo) {
        fetch('/transp/cancel/' + transpNo, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ transpNo: transpNo })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 상태 업데이트 및 이메일 발송 성공 시 모달 닫기
                alert('운송이 취소되었습니다. 이메일을 발송했습니다.');
                var modal = bootstrap.Modal.getInstance(document.getElementById('transpModal'));
                modal.hide();

                // 테이블에서 해당 행 업데이트 (운송 상태 변경)
                const row = document.querySelector('[data-transp-no="'+ transpNo +'"]');
                if (row) {
                    row.querySelector('[data-transp-status]').innerText = '운송 취소';
                }
            } else {
                alert('운송 취소에 실패했습니다.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('운송 취소 처리 중 오류가 발생했습니다.');
        });
    }
</script>


</main>
</html>
