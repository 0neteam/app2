<body>
    <h2>이메일 전송</h2>
    <button onclick="sendEmails()">이메일 보내기</button>
    
    <script>
        function sendEmails() {
            fetch('/send-emails', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
